<div class="streak-bg-accent" aria-hidden="true"></div>

<div class="streak-header">
  <svg lucideFlame [size]="18" class="streak-icon"></svg>
  <span class="streak-label">{{ title() }}</span>
</div>

<div class="streak-value">
  <span class="streak-number">{{ streak() }}</span>
  <span class="streak-unit">{{ daysLabel() }}</span>
</div>

<div class="streak-bars">
  @for (i of [1, 2, 3, 4, 5, 6, 7]; track i) {
    <div class="streak-bar" [style.animation-delay.ms]="i * 80"></div>
  }
</div>
